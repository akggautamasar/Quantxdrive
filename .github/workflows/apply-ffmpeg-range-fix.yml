name: Apply FFmpeg range fix

on:
  push:
    paths:
      - .github/workflows/apply-ffmpeg-range-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Render and HLS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          h = Path('backend/hls_service.py')
          s = h.read_text(encoding='utf-8')
          old = '        "-multiple_requests", "1",\n        "-i", source_url,'
          new = '        "-multiple_requests", "1",\n        "-request_size", str(8 * 1024 * 1024),\n        "-initial_request_size", str(2 * 1024 * 1024),\n        "-short_seek_size", str(8 * 1024 * 1024),\n        "-i", source_url,'
          if old not in s:
              raise SystemExit('HLS insertion point not found')
          h.write_text(s.replace(old, new, 1), encoding='utf-8')

          r = Path('backend/render.yaml')
          s = r.read_text(encoding='utf-8')
          old = '    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt'
          new = '''    buildCommand: |
      set -eux
      apt-get update
      apt-get install -y curl xz-utils ca-certificates
      curl -L --fail --silent --show-error https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-09-14-51/ffmpeg-n9.0.1-27-g9b0578816c-linux64-gpl-9.0.tar.xz -o /tmp/ffmpeg.tar.xz
      tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
      install -m 0755 "$(find /tmp -type f -path '*/bin/ffmpeg' -print -quit)" /usr/local/bin/ffmpeg
      install -m 0755 "$(find /tmp -type f -path '*/bin/ffprobe' -print -quit)" /usr/local/bin/ffprobe
      ffmpeg -version
      pip install -r requirements.txt'''
          if old not in s:
              raise SystemExit('Render buildCommand not found')
          r.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/hls_service.py backend/render.yaml
          git commit -m 'Use modern FFmpeg with bounded HLS ranges'
          git push
