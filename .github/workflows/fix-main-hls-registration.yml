name: Fix HLS registration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-main-hls-registration.yml'
      - 'backend/main.py'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register HLS routes in main app
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/main.py')
          s = p.read_text()
          if 'from hls_service import register_hls_routes' in s:
              print('HLS routes already registered in main.py')
              raise SystemExit(0)

          addition = '''\n# ── QuantXDrive HLS routes ───────────────────────────────────────────────────\n# Render starts `uvicorn main:app`, so HLS must be registered on this app object.\n# Importing here after all main.py definitions avoids the circular-import issue.\nfrom hls_service import register_hls_routes\nregister_hls_routes(app)\nprint("✅ HLS routes registered on main:app", flush=True)\n'''
          p.write_text(s.rstrip() + addition + '\n')
          PY

      - name: Verify Python compilation
        run: |
          python -m py_compile backend/main.py backend/hls_service.py backend/app.py

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'fix: register HLS routes on main app'
            git push
          fi
