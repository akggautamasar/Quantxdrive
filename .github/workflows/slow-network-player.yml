name: Slow Network Player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply slow-network player refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HLS FFmpeg runtime
        run: |
          python3 <<'PY'
          from pathlib import Path
          h=Path('backend/hls_service.py')
          s=h.read_text()
          old='        "-multiple_requests", "1",\n        "-i", source_url,'
          new='        "-multiple_requests", "1",\n        "-request_size", str(8 * 1024 * 1024),\n        "-initial_request_size", str(2 * 1024 * 1024),\n        "-short_seek_size", str(8 * 1024 * 1024),\n        "-i", source_url,'
          if old in s:
              s=s.replace(old,new,1)
              h.write_text(s)
          r=Path('backend/render.yaml')
          s=r.read_text()
          old='    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt'
          new='''    buildCommand: |
      set -eux
      apt-get update
      apt-get install -y curl xz-utils ca-certificates
      curl -L --fail --silent --show-error https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-09-14-51/ffmpeg-n9.0.1-27-g9b0578816c-linux64-gpl-9.0.tar.xz -o /tmp/ffmpeg.tar.xz
      tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
      install -m 0755 "$(find /tmp -type f -path '*/bin/ffmpeg' -print -quit)" /usr/local/bin/ffmpeg
      install -m 0755 "$(find /tmp -type f -path '*/bin/ffprobe' -print -quit)" /usr/local/bin/ffprobe
      ffmpeg -version
      pip install -r requirements.txt'''
          if old in s:
              r.write_text(s.replace(old,new,1))
          PY
      - name: Patch player
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('frontend/src/AdaptiveVideo.jsx')
          s=p.read_text()
          s=s.replace('  const hlsStartedRef = useRef(false);','  const hlsStartedRef = useRef(false);\n  const qualityCountRef = useRef(0);')
          s=s.replace('      if (cancelled || hlsStartedRef.current || !src) return;','      if (cancelled || !src) return;')
          old='''        if(r.ok){ const d=await r.json(); if(d.ready){await startHls();return;} setPreparing(!!d.preparing); }'''
          new='''        if(r.ok){
          const d=await r.json();
          const count=(d.qualities||[]).length;
          if(d.ready && !hlsStartedRef.current){ await startHls(); }
          else if(hlsStartedRef.current && count>qualityCountRef.current && hlsRef.current){
            qualityCountRef.current=count;
            const wasPlaying=!video.paused;
            const resumeAt=Number.isFinite(video.currentTime)?video.currentTime:0;
            const hls=hlsRef.current;
            hls.loadSource(src+(src.includes('?')?'&':'?')+'q='+count);
            hls.once(Hls.Events.MANIFEST_PARSED,()=>{
              try{if(resumeAt>0)video.currentTime=resumeAt}catch{}
              if(wasPlaying||autoPlay)video.play().catch(()=>{});
            });
          }
          setPreparing(!!d.preparing && count<3);
          qualityCountRef.current=count;
          if(d.failed){setPreparing(false);return;}
        }'''
          if old in s: s=s.replace(old,new)
          s=s.replace('    hlsStartedRef.current=false; setLevels([]); setLevel(-1); setPreparing(false); setError("");','    hlsStartedRef.current=false; qualityCountRef.current=0; setLevels([]); setLevel(-1); setPreparing(false); setError("");')
          s=s.replace('      if(!cancelled&&!hlsStartedRef.current) pollRef.current=setTimeout(pollStatus,3000);','      if(!cancelled) pollRef.current=setTimeout(pollStatus,4000);')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/hls_service.py backend/render.yaml frontend/src/AdaptiveVideo.jsx
          git diff --cached --check
          git commit -m "Apply slow-network player refresh" || exit 0
          git push
