name: Repair Telegram transport recovery

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch and verify backend
        run: |
          python3 tools/repair_telegram_transport.py
          python3 -m py_compile backend/main.py

      - name: Commit backend fix and remove repair files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py
          git rm -f tools/repair_telegram_transport.py .github/workflows/repair-telegram-transport.yml
          git commit -m "fix: recover Telegram RPC transport before media refresh [skip ci]"
          git push
