name: Slow Network HLS Instant Start

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Apply slow-network HLS instant-start migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch HLS backend and player
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('backend/hls_service.py')
          s = p.read_text()

          s = s.replace('HLS_TRANSCODE_SEMAPHORE = asyncio.Semaphore(1)', 'HLS_JOB_SEMAPHORE = asyncio.Semaphore(1)')

          start = s.index('def _write_master(')
          end = s.index('async def prepare_hls(', start)
          new_helpers = r'''VARIANTS = [
              ("v0", "256x144", "96k", "120k", "200k", "24k"),
              ("v1", "426x240", "180k", "220k", "360k", "32k"),
              ("v2", "640x360", "400k", "480k", "720k", "48k"),
          ]

          def _write_master(out_dir: Path, names):
              specs = {name: (resolution, maxrate) for name, resolution, _, maxrate, _, _ in VARIANTS}
              lines = ["#EXTM3U", "#EXT-X-VERSION:3"]
              for name in names:
                  resolution, bandwidth = specs[name]
                  lines += [
                      f"#EXT-X-STREAM-INF:BANDWIDTH={bandwidth},AVERAGE-BANDWIDTH={bandwidth},RESOLUTION={resolution}",
                      f"{name}/playlist.m3u8",
                  ]
              tmp = out_dir / "master.m3u8.tmp"
              tmp.write_text("\\n".join(lines) + "\\n", encoding="utf-8")
              tmp.replace(out_dir / "master.m3u8")

          async def _encode_variant(source: Path, out_dir: Path, variant, live=False):
              name, resolution, video_bitrate, maxrate, bufsize, audio_bitrate = variant
              variant_dir = out_dir / name
              variant_dir.mkdir(parents=True, exist_ok=True)
              playlist = variant_dir / "playlist.m3u8"
              segment_pattern = variant_dir / "seg_%05d.ts"
              cmd = [
                  "ffmpeg", "-hide_banner", "-loglevel", "error",
                  "-threads", "1", "-filter_threads", "1", "-filter_complex_threads", "1",
                  "-i", str(source),
                  "-map", "0:v:0", "-map", "0:a:0?",
                  "-c:v", "libx264", "-preset", "ultrafast", "-profile:v", "main", "-pix_fmt", "yuv420p",
                  "-sc_threshold", "0", "-r", "24", "-g", "48", "-keyint_min", "48",
                  "-force_key_frames", "expr:gte(t,n_forced*2)",
                  "-s:v", resolution, "-b:v", video_bitrate, "-maxrate", maxrate, "-bufsize", bufsize,
                  "-c:a", "aac", "-ar", "44100", "-b:a", audio_bitrate, "-ac", "2",
                  "-f", "hls", "-hls_time", "2", "-hls_list_size", "0",
                  "-hls_flags", "independent_segments", "-hls_segment_filename", str(segment_pattern),
                  "-hls_playlist_type", "event" if live else "vod", str(playlist),
              ]
              print(f"🎞️ HLS encoding {name} for source {source.name}", flush=True)
              proc = await asyncio.create_subprocess_exec(*cmd, stdout=asyncio.subprocess.DEVNULL, stderr=asyncio.subprocess.PIPE)
              if live:
                  for _ in range(120):
                      if playlist.exists() and list(variant_dir.glob("seg_*.ts")):
                          print(f"⚡ HLS first segment ready for {name}", flush=True)
                          break
                      if proc.returncode is not None:
                          break
                      await asyncio.sleep(0.25)
              _, stderr = await proc.communicate()
              if proc.returncode != 0:
                  raise RuntimeError(f"ffmpeg {name} failed ({proc.returncode}): {stderr.decode('utf-8', 'ignore')[-6000:]}")
              if not playlist.exists():
                  raise RuntimeError(f"ffmpeg {name} produced no playlist")

          '''
          s = s[:start] + new_helpers + s[end:]

          start = s.index('async def prepare_hls(')
          end = s.index('def _hls_response(', start)
          new_prepare = r'''async def prepare_hls(file_id: int):
              file = await main.db.get_file_by_id(file_id)
              if not file:
                  raise HTTPException(status_code=404, detail="File not found")
              mime = file.get("mime") or main.get_mime(file.get("filename", ""))
              if not mime.startswith("video/"):
                  raise HTTPException(status_code=400, detail="HLS is available only for videos")
              size = int(file.get("size") or 0)
              if size and size > MAX_HLS_SOURCE_BYTES:
                  raise HTTPException(status_code=413, detail="Video is too large for on-demand HLS preparation")
              master = _master_path(file_id)
              if master.exists():
                  return file
              lock = await _lock_for(file_id)
              async with lock:
                  if master.exists():
                      return file
                  async with HLS_JOB_SEMAPHORE:
                      out_dir = _dir(file_id)
                      tmp_dir = HLS_ROOT / f".{file_id}.building"
                      shutil.rmtree(tmp_dir, ignore_errors=True)
                      shutil.rmtree(out_dir, ignore_errors=True)
                      tmp_dir.mkdir(parents=True, exist_ok=True)
                      suffix = Path(file.get("filename") or "video.mp4").suffix.lower() or ".mp4"
                      source = tmp_dir / ("source" + suffix)
                      try:
                          await _download_source(file, source)
                          out_dir.mkdir(parents=True, exist_ok=True)

                          # Low-bitrate EVENT HLS becomes playable as soon as the first
                          # 2-second segment exists. Higher qualities are added later.
                          await _encode_variant(source, out_dir, VARIANTS[0], live=True)
                          _write_master(out_dir, ["v0"])
                          print(f"⚡ HLS low-bandwidth stream ready for file {file_id}", flush=True)

                          await _encode_variant(source, out_dir, VARIANTS[1], live=False)
                          _write_master(out_dir, ["v0", "v1"])
                          print(f"⚡ HLS 240p available for file {file_id}", flush=True)

                          await _encode_variant(source, out_dir, VARIANTS[2], live=False)
                          _write_master(out_dir, ["v0", "v1", "v2"])
                          print(f"⚡ HLS 360p available for file {file_id}", flush=True)

                          source.unlink(missing_ok=True)
                          shutil.rmtree(tmp_dir, ignore_errors=True)
                          print(f"✅ HLS ready for file {file_id}", flush=True)
                          return file
                      except Exception:
                          source.unlink(missing_ok=True)
                          shutil.rmtree(tmp_dir, ignore_errors=True)
                          if not master.exists():
                              shutil.rmtree(out_dir, ignore_errors=True)
                          raise
              return file

          '''
          s = s[:start] + new_prepare + s[end:]

          # Make playlists/segments refresh immediately while they are growing.
          s = s.replace('"Cache-Control": "public, max-age=3600",', '"Cache-Control": "no-cache, no-store, must-revalidate",')

          start = s.index('    @app.get("/api/hls/{token}/{file_id}/status")')
          new_status = r'''    @app.get("/api/hls/{token}/{file_id}/status")
              async def hls_status(token: str, file_id: int):
                  if not main.verify_jwt(token):
                      raise HTTPException(status_code=401, detail="Invalid token")
                  file = await main.db.get_file_by_id(file_id)
                  if not file:
                      raise HTTPException(status_code=404, detail="File not found")

                  master = _master_path(file_id)
                  if not master.exists() and file_id not in PREPARE_FAILED:
                      task = PREPARE_TASKS.get(file_id)
                      if not task or task.done():
                          await _start_prepare(file_id)

                  task = PREPARE_TASKS.get(file_id)
                  available = [name for name, *_ in VARIANTS if (_dir(file_id) / name / "playlist.m3u8").exists()]
                  ready = master.exists()
                  if ready:
                      PREPARE_FAILED.discard(file_id)
                  return {
                      "ready": ready,
                      "preparing": bool(task and not task.done()),
                      "failed": file_id in PREPARE_FAILED and not ready,
                      "qualities": available,
                  }
          '''
          # status is the last function in this module
          s = s[:start] + new_status
          p.write_text(s)

          # Update the player so it keeps watching preparation and refreshes the
          # master playlist when 240p/360p become available.
          p = Path('frontend/src/AdaptiveVideo.jsx')
          s = p.read_text()
          s = s.replace('  const hlsStartedRef = useRef(false);', '  const hlsStartedRef = useRef(false);\n  const qualityCountRef = useRef(0);')
          s = s.replace('      if (cancelled || hlsStartedRef.current || !src) return;\n      try {', '      if (cancelled || !src) return;\n      try {')
          s = s.replace('        if(r.ok){ const d=await r.json(); if(d.ready){await startHls();return;} setPreparing(!!d.preparing); }', '''        if(r.ok){
          const d=await r.json();
          const count=(d.qualities||[]).length;
          if(d.ready && !hlsStartedRef.current){ await startHls(); }
          else if(hlsStartedRef.current && count>qualityCountRef.current && hlsRef.current){
            qualityCountRef.current=count;
            const wasPlaying=!video.paused;
            const resumeAt=Number.isFinite(video.currentTime)?video.currentTime:0;
            hlsRef.current.loadSource(src+(src.includes('?')?'&':'?')+'q='+count);
            hlsRef.current.once(Hls.Events.MANIFEST_PARSED,()=>{
              try{if(resumeAt>0)video.currentTime=resumeAt}catch{}
              if(wasPlaying||autoPlay)video.play().catch(()=>{});
            });
          }
          setPreparing(!!d.preparing && count<3);
          qualityCountRef.current=count;
          if(d.failed){setPreparing(false);return;}
        }''')
          s = s.replace('    hlsStartedRef.current=false; setLevels([]); setLevel(-1); setPreparing(false); setError("");', '    hlsStartedRef.current=false; qualityCountRef.current=0; setLevels([]); setLevel(-1); setPreparing(false); setError("");')
          s = s.replace('      if(cancelled&&!hlsStartedRef.current) pollRef.current=setTimeout(pollStatus,3000);', '      if(!cancelled) pollRef.current=setTimeout(pollStatus,4000);') if 'if(cancelled&&!hlsStartedRef.current)' in s else s
          # Replace the existing tail scheduling line exactly.
          s = s.replace('      if(!cancelled&&!hlsStartedRef.current) pollRef.current=setTimeout(pollStatus,3000);', '      if(!cancelled) pollRef.current=setTimeout(pollStatus,4000);')
          p.write_text(s)
          PY

      - name: Validate Python syntax
        run: python3 -m py_compile backend/hls_service.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/hls_service.py frontend/src/AdaptiveVideo.jsx
          git diff --cached --check
          git commit -m "Apply slow-network HLS instant-start migration" || exit 0
          git push
