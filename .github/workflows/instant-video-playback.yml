name: Instant Video Playback Patch
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix HLS status bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/hls_service.py')
          s=p.read_text()
          old='''        master = _master_path(file_id)\n        task = PREPARE_TASKS.get(file_id)\n        return {\n            "ready": master.exists(),\n            "preparing": bool(task and not task.done()),\n            "failed": bool(task and task.done() and not task.cancelled() and task.exception()),\n        }'''
          new='''        master = _master_path(file_id)\n        if master.exists():\n            return {"ready": True, "preparing": False, "failed": False}\n\n        # Status polling must also bootstrap preparation. After a Render restart\n        # PREPARE_TASKS is empty, so waiting for the master alone would deadlock.\n        task = PREPARE_TASKS.get(file_id)\n        if not task or task.done():\n            await _start_prepare(file_id)\n            task = PREPARE_TASKS.get(file_id)\n\n        return {\n            "ready": master.exists(),\n            "preparing": bool(task and not task.done()),\n            "failed": bool(task and task.done() and not task.cancelled() and task.exception()),\n        }'''
          if old not in s:
              raise SystemExit('Expected hls_status block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Stop this one-time patch workflow
        run: git rm .github/workflows/instant-video-playback.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/hls_service.py
          git commit -m 'fix: bootstrap HLS preparation from status endpoint'
          git add -A
          git commit -m 'chore: remove one-time playback patch workflow' || true
          git push