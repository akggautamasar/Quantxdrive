name: Fix HLS FFmpeg compatibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix HLS FFmpeg compatibility') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsupported FFmpeg HTTP options
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/hls_service.py')
          s = p.read_text()
          s2 = s.replace('        "-request_size", str(4 * 1024 * 1024),\n', '')
          s2 = s2.replace('        "-initial_request_size", str(2 * 1024 * 1024),\n', '')
          if s2 == s:
              print('No compatibility patch needed')
          else:
              p.write_text(s2)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/hls_service.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix HLS FFmpeg compatibility'
          git push
