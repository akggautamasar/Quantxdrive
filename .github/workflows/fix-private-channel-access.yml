name: Fix private Telegram channel access

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch private channel resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/channels_service.py')
          s = p.read_text()
          start = s.index('async def _resolve_with_clients(target):')
          end = s.index('\n\ndef _normalize_target', start)
          new = '''async def _resolve_with_clients(target):
              import main
              errors = []
              clients = [(main.pyro_client, "session")]
              bot = await _get_bot_client()
              if bot:
                  clients.append((bot, "bot"))

              async def resolve(client, mode):
                  try:
                      return await client.get_chat(target)
                  except Exception as first_error:
                      # Private numeric channel IDs require a cached Telegram peer.
                      # If the connected account is already a member, walking its
                      # dialogs refreshes that peer and lets us resolve the ID.
                      if isinstance(target, int):
                          try:
                              async for dialog in client.get_dialogs():
                                  chat = getattr(dialog, "chat", None)
                                  if chat and int(chat.id) == int(target):
                                      return chat
                          except Exception as dialog_error:
                              errors.append(f"{mode} dialogs: {dialog_error}")
                      # Private invite links can be used even when the peer is not
                      # cached. join_chat also succeeds for an already accessible
                      # invite in the normal member flow.
                      if isinstance(target, str) and ("t.me/+" in target or "t.me/joinchat/" in target or target.startswith("+")):
                          try:
                              return await client.join_chat(target)
                          except Exception as join_error:
                              errors.append(f"{mode} invite: {join_error}")
                      errors.append(f"{mode}: {first_error}")
                      return None

              for client, mode in clients:
                  if not client:
                      continue
                  chat = await resolve(client, mode)
                  if chat:
                      return chat, client, mode

              raise HTTPException(
                  status_code=400,
                  detail=(
                      "Telegram could not access this channel. For a private channel, "
                      "use its private invite link (t.me/+... or t.me/joinchat/...) "
                      "or make sure the SESSION_STRING account is already a member. "
                      + " | ".join(errors)
                  ),
              )
'''
          s = s[:start] + new + s[end:]

          start = s.index('def _normalize_target(raw: str):')
          end = s.index('\n\nasync def _resolve_channel', start)
          new = '''def _normalize_target(raw: str):
              value = str(raw or "").strip()
              if not value:
                  return None
              if value.lstrip("-").isdigit():
                  return int(value)
              if value.startswith("@"):
                  return value
              if value.startswith("+"):
                  return value
              if value.startswith(("http://", "https://")):
                  parsed = urlparse(value)
                  host = (parsed.netloc or "").lower()
                  if host.endswith("t.me") or host.endswith("telegram.me"):
                      parts = [p for p in parsed.path.split("/") if p]
                      if parts and parts[0] in {"joinchat"} and len(parts) > 1:
                          return value
                      if parts and parts[0].startswith("+"):
                          return value
                      if parts and parts[0] not in {"c"}:
                          return "@" + parts[0]
              if value.startswith(("t.me/", "telegram.me/")):
                  rest = value.split("/", 1)[1]
                  parts = [p for p in rest.split("/") if p]
                  if parts and parts[0] == "joinchat" and len(parts) > 1:
                      return value
                  if parts and parts[0].startswith("+"):
                      return value
                  if parts and parts[0] not in {"c"}:
                      return "@" + parts[0]
              if all(ch.isalnum() or ch == "_" for ch in value):
                  return "@" + value
              return value
'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY
          python -m py_compile backend/channels_service.py
      - name: Remove patch workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-private-channel-access.yml
          git add backend/channels_service.py
          git commit -m "Support private Telegram channel peers and invite links"
          git push
