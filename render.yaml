services:
  - type: web
    name: airdrive-api
    runtime: python
    plan: free
    healthCheckPath: /
    rootDir: backend
    buildCommand: |
      set -eux
      apt-get update
      apt-get install -y curl xz-utils ca-certificates
      rm -rf .render-ffmpeg .render-ffmpeg-tmp
      mkdir -p .render-ffmpeg .render-ffmpeg-tmp
      curl -L --fail --silent --show-error https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-09-14-51/ffmpeg-n9.0.1-27-g9b0578816c-linux64-gpl-9.0.tar.xz -o .render-ffmpeg-tmp/ffmpeg.tar.xz
      tar -xJf .render-ffmpeg-tmp/ffmpeg.tar.xz -C .render-ffmpeg-tmp
      install -m 0755 "$(find .render-ffmpeg-tmp -type f -path '*/bin/ffmpeg' -print -quit)" .render-ffmpeg/ffmpeg
      install -m 0755 "$(find .render-ffmpeg-tmp -type f -path '*/bin/ffprobe' -print -quit)" .render-ffmpeg/ffprobe
      .render-ffmpeg/ffmpeg -version
      .render-ffmpeg/ffmpeg -hide_banner -h protocol=http 2>&1 | grep -q request_size
      .render-ffmpeg/ffmpeg -hide_banner -h protocol=http 2>&1 | grep -q initial_request_size
      .render-ffmpeg/ffmpeg -hide_banner -h protocol=http 2>&1 | grep -q short_seek_size
      rm -rf .render-ffmpeg-tmp
      pip install -r requirements.txt
    startCommand: PATH="$PWD/.render-ffmpeg:$PATH" uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: INDEX_CHANNEL_ID
        value: "me"
