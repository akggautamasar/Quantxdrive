services:
  - type: web
    name: airdrive-api
    runtime: python
    plan: free
    healthCheckPath: /
    rootDir: backend
    buildCommand: |
      set -eux
      bash ./ensure_render_ffmpeg.sh
      pip install -r requirements.txt
    startCommand: |
      set -e
      bash ./ensure_render_ffmpeg.sh
      export FFMPEG_BINARY="$PWD/.render-ffmpeg/ffmpeg"
      export PATH="$PWD/.render-ffmpeg:$PATH"
      exec uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: INDEX_CHANNEL_ID
        value: "me"
